name: Build EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Verify dependency graph
        run: python -m pip check

      - name: Release metadata and tag guard
        run: python release_guard.py

      - name: Pre-release tests
        run: python pre_release_test.py

      - name: Offline test suite
        run: python -m unittest discover -s src/auto/tests -p "test_*.py"

      # GUI dynamically imports exam/pk/remote/parser/browser/strategy/hotkey.
      # CustomTkinter needs package data plus darkdetect in onefile builds.
      - name: Build GUI
        run: >
          pyinstaller --onefile --noconsole
          --hidden-import=websocket
          --hidden-import=ets_common
          --hidden-import=ets_selftest
          --hidden-import=ets_pk_store
          --hidden-import=ets_compat
          --hidden-import=ets_auto
          --hidden-import=ets_word_pk
          --hidden-import=ets_strategy
          --hidden-import=ets_hotkey
          --hidden-import=ets_remote
          --hidden-import=ets_parser
          --hidden-import=ets_browser_ui
          --hidden-import=ets_recording_ui
          --hidden-import=ets_rw_mode
          --hidden-import=ets_tee
          --hidden-import=customtkinter
          --hidden-import=darkdetect
          --collect-all customtkinter
          --name ets_gui src/auto/ets_gui.py

      - name: Build exam
        run: >
          pyinstaller --onefile
          --hidden-import=websocket
          --hidden-import=ets_common
          --hidden-import=ets_selftest
          --hidden-import=ets_strategy
          --hidden-import=ets_hotkey
          --hidden-import=ets_recording_ui
          --hidden-import=ets_rw_mode
          --hidden-import=ets_tee
          --name ets_auto src/auto/ets_auto.py

      - name: Build PK
        run: >
          pyinstaller --onefile
          --hidden-import=websocket
          --hidden-import=ets_common
          --hidden-import=ets_selftest
          --hidden-import=ets_pk_store
          --hidden-import=ets_hotkey
          --add-data "ecdict_pk.json;."
          --name ets_pk src/auto/ets_word_pk.py

      - name: Smoke test packaged executables
        timeout-minutes: 5
        run: python packaged_smoke_test.py --dist dist --timeout 60

      - name: Upload GUI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ets_gui.exe
          path: dist/ets_gui.exe
          if-no-files-found: error

      - name: Upload exam artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ets_auto.exe
          path: dist/ets_auto.exe
          if-no-files-found: error

      - name: Upload PK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ets_pk.exe
          path: dist/ets_pk.exe
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download packaged executables
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: ets_*.exe
          path: release
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: |
            release/ets_gui.exe
            release/ets_auto.exe
            release/ets_pk.exe
          generate_release_notes: true
