name: Build EXE

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Pre-release tests
        run: python pre_release_test.py

      - name: Build GUI
        run: pyinstaller --onefile --noconsole --hidden-import=websocket --hidden-import=ets_common --hidden-import=ets_remote --hidden-import=customtkinter --name ets_gui src/auto/ets_gui.py

      - name: Build exam
        run: pyinstaller --onefile --hidden-import=websocket --hidden-import=ets_common --name ets_auto src/auto/ets_auto.py

      - name: Build PK
        run: pyinstaller --onefile --hidden-import=websocket --hidden-import=ets_common --add-data "ecdict_pk.json;." --name ets_pk src/auto/ets_word_pk.py

      - name: Upload GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ets_gui.exe
          path: dist/ets_gui.exe

      - name: Upload exam artifact
        uses: actions/upload-artifact@v4
        with:
          name: ets_auto.exe
          path: dist/ets_auto.exe

      - name: Upload PK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ets_pk.exe
          path: dist/ets_pk.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/ets_gui.exe
            dist/ets_auto.exe
            dist/ets_pk.exe
          generate_release_notes: true
